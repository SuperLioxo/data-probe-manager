global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'probe-admin'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['admin:8081']

  - job_name: 'probe-agent'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['agent:58081']
