apiVersion: v1
kind: Service
metadata:
  name: {{ include "probe-manager.fullname" . }}-web
  labels:
    app: web
    {{- include "probe-manager.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: 80
      protocol: TCP
  selector:
    app: web
