# Docker profile — overrides for container networking
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/probe_db}
    username: ${SPRING_DATASOURCE_USERNAME:probe_user}
    password: ${SPRING_DATASOURCE_PASSWORD:probe_pass}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  address: 0.0.0.0

logging:
  file:
    name: /app/logs/admin.log
  level:
    root: INFO
    com.lixin.probe: INFO
